server:
  port: 8181

spring:
  application:
    name: expenses-agent

  config:
    import: optional:file:.env

  # mcp client config
  ai:
    mcp:
      client:
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            search_products:
              url: http://localhost:8081
              endpoint: /mcp

    # spring ai openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-6-luna
        reasoning-effort: "none"
    model:
      audio.speech: none
      audio.transcription: none
      image: none
      moderation: none

  # spring datasource with H2
  jpa:
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

  datasource:
    url: jdbc:h2:file:./data/expenses-agent
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings:
        web-allow-others: ${H2_CONSOLE_WEB_ALLOW_OTHERS:true}

agent:
  chat:
    memory:
      window:
        size: 30
  system-prompt-file: ${AGENT_SYSTEM_PROMPT_FILE:classpath:prompts/system-prompt.md}


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor:
                SimpleLoggerAdvisor: INFO
